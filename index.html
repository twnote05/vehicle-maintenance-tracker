<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a64c8">
<title>ดูแลรถ</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ดูแลรถ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#0f172a;--sub:#475569;--line:#cbd5e1;--brand:#0a64c8;--brand-d:#084e9e;
--ok:#166534;--ok-bg:#dcfce7;--soon:#7c4a03;--soon-bg:#fef3c7;--bad:#991b1b;--bad-bg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 40px;background:var(--bg);color:var(--ink);font:18px/1.5 'Sarabun','Noto Sans Thai','Segoe UI',Tahoma,sans-serif}
.wrap{max-width:560px;margin:0 auto}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header .logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center}
header h1{margin:0;font-size:28px}
header p{margin:0;color:var(--sub);font-size:16px}
nav{position:fixed;inset:auto 0 0 0;z-index:5;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(15,23,42,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;gap:4px;width:100%;max-width:560px}
nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:6px 4px;border-radius:12px;color:var(--sub);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
nav a:hover{background:#e2e8f0}
nav a[aria-current=page]{background:#e6f0fc;color:var(--brand)}
nav a{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:#fff;font-size:14px;line-height:22px;text-align:center}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;margin:0 0 12px;line-height:1.25}
label{display:block;font-weight:700;margin:0 0 6px}
.opt{font-weight:400;color:var(--sub)}
.f{margin-bottom:18px}
input,select{width:100%;min-height:52px;padding:10px 14px;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #1b6fd1;outline-offset:2px}
::selection{background:#bfd4f5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:44px;padding:6px 14px;font:inherit;background:var(--card);border:2px solid var(--line);border-radius:22px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.btn{display:block;width:100%;min-height:58px;font:inherit;font-weight:700;font-size:20px;color:#fff;background:var(--brand);border:0;border-radius:12px;cursor:pointer;padding:14px}
.btn:hover{background:var(--brand-d)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:18px;min-height:52px}
.btn.alt:hover{background:#e2e8f0}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-weight:700}
.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.good{background:var(--ok-bg);color:var(--ok)}
.hint{color:var(--sub);font-size:16px;margin-top:4px}
.car{background:var(--card);border:0;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,23,42,.07)}
.car h2{font-size:21px;margin:0 0 8px}
.tag{display:inline-block;padding:4px 12px;border-radius:16px;font-weight:700;margin-bottom:8px}
.ok{background:var(--ok-bg);color:var(--ok)}.soon{background:var(--soon-bg);color:var(--soon)}
.overdue{background:var(--bad-bg);color:var(--bad)}.none{background:#e2e8f0;color:var(--sub)}
.meta{color:var(--sub);font-size:16px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.empty{padding:24px;text-align:center;color:var(--sub)}
.rec{flex-wrap:wrap}.rec>div{min-width:0;overflow-wrap:anywhere}
.rec{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rec b{display:block}
.del{min-height:44px;padding:6px 14px;font:inherit;color:var(--bad);background:var(--card);border:2px solid var(--bad);border-radius:10px;cursor:pointer}
.hero{position:relative;border-radius:20px;box-shadow:0 6px 20px rgba(15,23,42,.18);overflow:hidden;margin-bottom:20px;background:var(--brand);color:#fff}
.hero img,.ph{display:block;width:100%;aspect-ratio:16/9;max-height:240px;object-fit:cover}
.ph{display:grid;place-items:center;font-size:56px;aspect-ratio:21/9;max-height:120px;font-weight:700;background:var(--brand-d)}
.hero .bar{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.hero select{background:#fff;color:var(--ink);font-weight:700}
.thumb{width:84px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.car img.cover{display:block;width:calc(100% + 32px);margin:-16px -16px 12px;aspect-ratio:16/9;object-fit:cover;border-radius:12px 12px 0 0}
.st{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.st .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.st b{font-size:19px}
.st .tag{margin:0;padding:2px 10px;font-size:16px}
.track{height:16px;background:#e2e8f0;border-radius:7px;overflow:hidden;margin:8px 0 6px}
.fill{height:100%;border-radius:7px}
.fill.ok{background:var(--ok)}.fill.soon{background:#c47f00}.fill.overdue{background:var(--bad)}
.card2{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.07)}
.big{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:18px;font-weight:600;color:var(--sub);margin-left:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tiles .card2{margin:0}.tiles b{display:block;font-size:36px;line-height:1.2}
.tiles .t-bad b{color:var(--bad)}.tiles .t-soon b{color:var(--soon)}
.donutwrap{display:flex;align-items:center;gap:20px}
.donut{flex:none;width:112px;height:112px;border-radius:50%;-webkit-mask:radial-gradient(circle 36px,transparent 97%,#000 100%);mask:radial-gradient(circle 36px,transparent 97%,#000 100%)}
.legend{flex:1;list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.row2{display:grid;gap:10px;margin-top:20px}
@media(max-width:359px){body{padding-left:12px;padding-right:12px}nav{padding-left:2px;padding-right:2px}nav .in{gap:0}nav a{font-size:12.5px;padding:6px 1px}h1{font-size:24px}header h1{font-size:24px}.big{font-size:36px}}
@media(min-width:700px){body{padding:32px}.row2{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header><img class="logo" src="icons/icon-192.png" alt="" width="44" height="44"><div><h1>ดูแลรถ</h1><p>จดงาน ดูสถานะ รู้ก่อนถึงกำหนด</p></div></header>
  <div id="hero"></div>
  <p class="hint"><a href="#settings">เชื่อม Google Sheet</a></p>
  <p id="sync" class="hint" role="status"></p>
  <main id="main"></main>
</div>
<nav aria-label="เมนู"><div class="in"><a href="#add"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg><span>บันทึก</span></a><a href="#status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg><span>สถานะ</span></a><a href="#schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg><span>ตารางซ่อม</span></a><a href="#alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>แจ้งเตือน</span></a><a href="#cars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg><span>โปรไฟล์</span></a></div></nav>
<script>
const KEY='smart-old-car:v1', SOON=0.8;
// km = ระยะทางต่อรอบ (ไม่ใส่ = นับเวลาอย่างเดียว), mo = เดือนต่อรอบ, main = แสดงเสมอ
const REMINDERS=[
 {label:'เปลี่ยนน้ำมันเครื่อง',re:/น้ำมันเครื่อง|oil/i,not:/ไส้กรอง/,km:5000,mo:6,main:1},
 {label:'ต่อภาษี / พ.ร.บ.',re:/ภาษี|พ\.ร\.บ|พรบ/,mo:12,main:1,tax:1},
 {label:'ล้างรถ',re:/ล้างรถ|wash/i,mo:1,main:1},
 {label:'ไส้กรองน้ำมันเครื่อง',re:/ไส้กรองน้ำมันเครื่อง/,km:10000,mo:12},
 {label:'ไส้กรองอากาศ',re:/กรองอากาศ/,km:20000,mo:24},
 {label:'ตรวจเช็คระยะ',re:/ตรวจเช็ค/,km:10000,mo:12},
 {label:'น้ำมันเกียร์',re:/น้ำมันเกียร์/,km:40000,mo:48},
 {label:'น้ำมันเบรก',re:/น้ำมันเบรก/,mo:24},
 {label:'ผ้าเบรก',re:/ผ้าเบรก/,km:40000,mo:36},
 {label:'ยาง',re:/ยาง/,km:40000,mo:48},
 {label:'แบตเตอรี่',re:/แบต/,mo:24}];
let sched={},prefill=null;
try{sched=JSON.parse(localStorage.getItem(KEY+':sched'))||{}}catch(e){}
const saveSched=()=>{try{localStorage.setItem(KEY+':sched',JSON.stringify(sched))}catch(e){}};
const eff=R=>({...R,...(sched[R.label]||{})});
const ivText=R=>[R.km?'ทุก '+R.km.toLocaleString('th-TH')+' กม.':'',R.mo?'ทุก '+(R.mo%12?R.mo+' เดือน':R.mo/12+' ปี'):''].filter(Boolean).join(' หรือ ');
const TYPES=['เปลี่ยนน้ำมันเครื่อง','ต่อภาษี / พ.ร.บ.','ล้างรถ','ตรวจเช็คระยะ','เปลี่ยนยาง','เปลี่ยนแบตเตอรี่','เปลี่ยนผ้าเบรก','อื่นๆ'];
// ---- โปรไฟล์รถ (เก็บในเครื่องนี้ รวมรูป) ----
let cars=[],active='';
try{cars=JSON.parse(localStorage.getItem(KEY+':cars'))||[];active=localStorage.getItem(KEY+':active')||''}catch(e){}
const saveCars=()=>{try{localStorage.setItem(KEY+':cars',JSON.stringify(cars));localStorage.setItem(KEY+':active',active);return true}catch(e){return false}};
const carByName=n=>cars.find(c=>c.name===n);
const activeCar=()=>cars.find(c=>c.id===active)||cars[0];
function shrink(file,max=800){return new Promise((ok,no)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/img.width),c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  img.onerror=()=>no(new Error('เปิดรูปนี้ไม่ได้'));img.src=u})}
const th=n=>Number(n).toLocaleString('th-TH');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let recs=[];
try{recs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs));return true}catch(e){return false}};

// ---- Google Sheet (ผ่าน Apps Script API). ไม่ตั้งค่า = เก็บในเครื่องอย่างเดียว ----
let cfg={url:'',token:''};
try{cfg={...cfg,...JSON.parse(localStorage.getItem(KEY+':cfg'))}}catch(e){}
const remoteOn=()=>!!(cfg.url&&cfg.token);
async function api(body){
  const r=body?await fetch(cfg.url,{method:'POST',body:JSON.stringify({token:cfg.token,...body})})
              :await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'ผิดพลาด');
  return j;
}
const setSync=t=>document.getElementById('sync').textContent=t;
async function pull(){
  if(!remoteOn())return setSync('เก็บในเครื่องนี้เท่านั้น (ยังไม่ได้เชื่อม Google Sheet)');
  setSync('กำลังโหลดจาก Google Sheet…');
  try{recs=(await api()).rows;save();setSync('เชื่อม Google Sheet แล้ว');render()}
  catch(e){setSync('เชื่อม Google Sheet ไม่ได้ ('+e.message+') กำลังแสดงข้อมูลที่จำไว้ในเครื่อง')}
}

// el('div',{class:'x'},child|text,...) — text goes through createTextNode, so no HTML injection
function el(tag,attrs={},...kids){
  const n=document.createElement(tag);
  for(const k in attrs){k.startsWith('on')?n[k]=attrs[k]:n.setAttribute(k,attrs[k])}
  kids.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));
  return n;
}
const msgBox=()=>el('div',{role:'alert',hidden:''});
function say(box,t,k){box.className='msg '+k;box.textContent=t;box.hidden=false}

function statusOf(name,taxDue){
  const rs=recs.filter(r=>r.vehicle===name),curKm=Math.max(0,...rs.map(r=>+r.km||0)),now=Date.now(),MO=30.44*864e5;
  return REMINDERS.map(R0=>{const R=eff(R0);
    let last=null;
    rs.forEach(r=>{if(R.re.test(r.type)&&!(R.not&&R.not.test(r.type))&&(!last||r.date>last.date))last={date:r.date,km:+r.km||0}});
    let due=last?new Date(last.date).getTime()+R.mo*MO:null;
    if(R.tax&&taxDue&&(!due||new Date(taxDue)>due)){due=new Date(taxDue).getTime();last=last||{km:0}}
    if(!due)return{R,last,status:'none',text:R.tax?'ใส่วันครบกำหนดภาษีในโปรไฟล์รถ หรือบันทึกงานนี้':'ยังไม่เคยบันทึก บันทึกงานนี้เพื่อเริ่มนับ'};
    const timeR=1-(due-now)/(R.mo*MO),kmLeft=R.km&&last.km&&curKm?last.km+R.km-curKm:null;
    const ratio=Math.max(timeR,kmLeft==null?0:1-kmLeft/R.km),days=Math.round((due-now)/864e5);
    const d=days>=0?'อีก '+th(days)+' วัน':'เกินมา '+th(-days)+' วัน',k=kmLeft==null?'':(kmLeft>=0?' / อีก ':' / เกินมา ')+th(Math.abs(kmLeft))+' กม.';
    return{R,last,status:ratio>=1?'overdue':ratio>=SOON?'soon':'ok',ratio:Math.max(0,Math.min(1,ratio)),text:d+k+' (ครบ '+new Date(due).toLocaleDateString('th-TH')+')'};
  });
}

function viewAdd(){
  const box=msgBox();
  const names=[...new Set([...cars.map(c=>c.name),...recs.map(r=>r.vehicle)])];
  const last=activeCar()?activeCar().name:recs.length?recs[recs.length-1].vehicle:'';
  const v=el('input',{id:'v',list:'cars',autocomplete:'off',placeholder:'เช่น Honda CR-V',value:(prefill&&prefill.vehicle)||last});
  const t=el('input',{id:'t',autocomplete:'off',placeholder:'พิมพ์ หรือกดเลือกด้านล่าง'});
  const k=el('input',{id:'k',type:'number',inputmode:'numeric',min:'0',placeholder:'เช่น 85000'});
  const c=el('input',{id:'c',type:'number',inputmode:'numeric',min:'0',placeholder:'เช่น 1800'});
  const d=el('input',{id:'d',type:'date',value:today(),max:today()});
  const chips=TYPES.map(x=>el('button',{type:'button',class:'chip','aria-pressed':'false',onclick:()=>{t.value=x;sync()}},x));
  const sync=()=>chips.forEach(b=>b.setAttribute('aria-pressed',b.textContent===t.value));
  t.oninput=sync;if(prefill){t.value=prefill.type;sync()}
  const go=el('button',{class:'btn',type:'submit'},'บันทึก');
  const f=el('form',{novalidate:'',onsubmit:async e=>{
    e.preventDefault();
    if(!v.value.trim())return say(box,'กรุณาใส่ชื่อรถ','err'),v.focus();
    if(!t.value.trim())return say(box,'กรุณาเลือกหรือพิมพ์ว่าทำอะไรไป','err'),t.focus();
    if(k.value<0||c.value<0)return say(box,'เลขไมล์และค่าใช้จ่ายต้องไม่ติดลบ','err');
    const rec={id:Date.now(),date:d.value||today(),vehicle:v.value.trim(),type:t.value.trim(),km:k.value===''?'':+k.value,cost:c.value===''?'':+c.value};
    go.disabled=true;go.textContent='กำลังบันทึก…';
    try{
      if(remoteOn())await api({action:'add',rec});
      recs.push(rec);
      if(!save()&&!remoteOn()){recs.pop();throw new Error('พื้นที่เก็บข้อมูลของเบราว์เซอร์ใช้ไม่ได้ (โหมดส่วนตัว?)')}
      t.value=k.value=c.value='';sync();say(box,remoteOn()?'บันทึกลง Google Sheet เรียบร้อยแล้ว':'บันทึกเรียบร้อยแล้ว','good');
    }catch(er){say(box,'บันทึกไม่สำเร็จ: '+er.message+' ลองกดบันทึกอีกครั้ง','err')}
    go.disabled=false;go.textContent='บันทึก';
  }},
    el('div',{class:'f'},el('label',{for:'v'},'รถคันไหน'),v,el('datalist',{id:'cars'},names.map(x=>el('option',{value:x})))),
    el('div',{class:'f'},el('label',{for:'t'},'ทำอะไรไป'),t,el('div',{class:'chips'},chips)),
    el('div',{class:'f'},el('label',{for:'d'},'วันที่'),d),
    el('div',{class:'f'},el('label',{for:'k'},'เลขไมล์ตอนนี้ ',el('span',{class:'opt'},'(ไม่บังคับ)')),k,el('div',{class:'hint'},'หน่วย กม. ช่วยให้เตือนรอบเปลี่ยนน้ำมันได้แม่นขึ้น')),
    el('div',{class:'f'},el('label',{for:'c'},'ค่าใช้จ่าย ',el('span',{class:'opt'},'(บาท, ไม่บังคับ)')),c),
    go);
  prefill=null;
  return[box,f,el('p',{class:'hint'},el('a',{href:'#history'},'ดูประวัติทั้งหมด →'))];
}

const COLORS={overdue:'#dc2626',soon:'#d97706',ok:'#16a34a'};
function dash(c,all){
  const rs=recs.filter(r=>r.vehicle===c.name),km=Math.max(0,...rs.map(r=>+r.km||0));
  const n={overdue:0,soon:0,ok:0};all.forEach(x=>n[x.status]!==undefined&&n[x.status]++);
  const tot=n.overdue+n.soon+n.ok;let a=0;
  const stops=tot?['overdue','soon','ok'].map(k=>{const f=a,t=a+n[k]/tot*100;a=t;return COLORS[k]+' '+f+'% '+t+'%'}).join(','):'#e2e8f0 0 100%';
  const NM={overdue:'เกินกำหนด',soon:'ใกล้ถึงกำหนด',ok:'ปกติ'};
  return el('div',{},
    el('div',{class:'card2'},el('div',{class:'meta'},c.name+(c.model?' · '+c.model:'')),el('div',{class:'big'},km?th(km):'-',el('small',{},'กม.')),el('div',{class:'meta'},km?'เลขไมล์ล่าสุดจากบันทึก':'ยังไม่มีเลขไมล์ ใส่ตอนบันทึกงาน')),
    el('div',{class:'tiles'},el('div',{class:'card2 t-bad'},'เกินกำหนด',el('b',{},n.overdue)),el('div',{class:'card2 t-soon'},'ใกล้ถึงกำหนด',el('b',{},n.soon))),
    el('div',{class:'card2 donutwrap'},el('div',{class:'donut',role:'img','aria-label':tot?'เกินกำหนด '+n.overdue+' ใกล้ถึง '+n.soon+' ปกติ '+n.ok:'ยังไม่มีข้อมูล',style:'background:conic-gradient('+stops+')'}),
      el('ul',{class:'legend'},['overdue','soon','ok'].map(k=>el('li',{},el('i',{style:'background:'+COLORS[k]}),NM[k],el('b',{},n[k]))))));
}
function viewStatus(){
  const L={ok:'ปกติ',soon:'ใกล้ถึงกำหนด',overdue:'เกินกำหนด',none:'ยังไม่มีข้อมูล'},ORD=['overdue','soon','ok','none'];
  const targets=cars.length?[activeCar()]:[...new Set(recs.map(r=>r.vehicle))].map(n=>({name:n}));
  if(!targets.length)return[el('div',{class:'empty'},'ยังไม่มีข้อมูล เริ่มจากเมนู "บันทึก" หรือเพิ่มรถที่ "โปรไฟล์รถ"')];
  return[...targets.flatMap(c=>{
    const all=statusOf(c.name,c.taxDue),rows=all.filter(x=>x.R.main||x.status!=='none');
    const bad=all.filter(x=>x.status==='overdue'||x.status==='soon').length;
    return[dash(c,all),el('section',{class:'car'},
      el('h2',{},c.name+(c.plate?' · '+c.plate:'')),
      el('span',{class:'tag '+(bad?'soon':'ok')},bad?'ต้องจัดการ '+bad+' เรื่อง':'ทุกอย่างปกติ'),
      ...rows.sort((a,b)=>ORD.indexOf(a.status)-ORD.indexOf(b.status)).map(x=>el('div',{class:'st'},
        el('div',{class:'top'},el('b',{},x.R.label),el('span',{class:'tag '+x.status},L[x.status])),
        el('div',{class:'track',role:'img','aria-label':x.status==='none'?'ไม่มีข้อมูล':'ใช้ไปแล้ว '+Math.round(x.ratio*100)+'% ของรอบ'},
          x.status==='none'?null:el('div',{class:'fill '+x.status,style:'width:'+Math.max(4,x.ratio*100)+'%'})),
        el('div',{class:'meta'},x.text))))];
  }),el('p',{class:'hint'},'แถบ = สัดส่วนของรอบที่ใช้ไปแล้ว (น้ำมันเครื่องทุก 5,000 กม. หรือ 6 เดือน, ล้างรถทุกเดือน) รายการอื่นๆ จะโผล่เมื่อบันทึกงานนั้น')];
}

function viewHistory(){
  const box=msgBox();
  const list=[...recs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(r=>el('div',{class:'rec'},
    el('div',{},el('b',{},r.type),el('span',{class:'meta'},`${r.vehicle} · ${new Date(r.date).toLocaleDateString('th-TH')}`+(r.km!==''?` · ${th(r.km)} กม.`:'')+(r.cost!==''?` · ${th(r.cost)} บาท`:''))),
    el('button',{class:'del','aria-label':'ลบ '+r.type,onclick:async()=>{
      if(!confirm('ลบรายการ "'+r.type+'" ใช่ไหม? ลบแล้วกู้คืนไม่ได้'))return;
      try{if(remoteOn())await api({action:'del',id:r.id})}catch(er){return say(box,'ลบไม่สำเร็จ: '+er.message,'err')}
      recs=recs.filter(x=>x.id!==r.id);save();render();
    }},'ลบ')));
  const file=el('input',{type:'file',accept:'application/json',hidden:'',onchange:async e=>{
    try{
      const data=JSON.parse(await e.target.files[0].text());
      if(!Array.isArray(data)||!data.every(r=>r&&r.vehicle&&r.type&&r.date))throw 0;
      if(!confirm('นำเข้า '+data.length+' รายการ? ข้อมูลปัจจุบันจะถูกแทนที่'))return;
      recs=data;save();render();
    }catch(_){say(box,'ไฟล์ไม่ถูกต้อง ใช้ไฟล์สำรองที่โหลดจากแอปนี้เท่านั้น','err')}
  }});
  const backup=el('button',{class:'btn alt',onclick:()=>{
    const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(recs,null,1)],{type:'application/json'})),download:'ดูแลรถ-สำรอง-'+today()+'.json'});
    a.click();URL.revokeObjectURL(a.href);
  }},'โหลดไฟล์สำรอง');
  return[box,...(list.length?list:[el('div',{class:'empty'},'ยังไม่มีรายการ')]),
    ...(remoteOn()?[el('div',{class:'row2'},backup)]
    :[el('p',{class:'hint'},'ข้อมูลเก็บในเครื่องนี้เท่านั้น เปลี่ยนมือถือหรือล้างข้อมูลเบราว์เซอร์แล้วจะหาย เชื่อม Google Sheet ที่เมนู "ตั้งค่า" หรือโหลดไฟล์สำรองไว้เป็นระยะ'),
      el('div',{class:'row2'},backup,el('button',{class:'btn alt',onclick:()=>file.click()},'นำเข้าไฟล์สำรอง'),file)])];
}

function viewSettings(){
  const box=msgBox();
  const u=el('input',{id:'u',type:'url',autocomplete:'off',placeholder:'https://script.google.com/macros/s/…/exec',value:cfg.url});
  const tk=el('input',{id:'tk',type:'password',autocomplete:'off',value:cfg.token});
  const save_=async e=>{
    e.preventDefault();
    const next={url:u.value.trim(),token:tk.value.trim()},prev=cfg;
    if(!next.url&&!next.token){cfg=next;localStorage.removeItem(KEY+':cfg');setSync('');pull();return say(box,'ยกเลิกการเชื่อมแล้ว ใช้เก็บในเครื่องนี้อย่างเดียว','good')}
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(next.url))return say(box,'ลิงก์ต้องขึ้นต้น https://script.google.com/macros/s/ และลงท้าย /exec','err');
    if(!next.token)return say(box,'กรุณาใส่รหัสลับ','err');
    cfg=next;say(box,'กำลังทดสอบการเชื่อมต่อ…','good');
    try{
      const rows=(await api()).rows;
      if(rows.length===0&&recs.length&&confirm('Google Sheet ยังว่างอยู่ ส่ง '+recs.length+' รายการในเครื่องนี้ขึ้นไปไหม?'))
        for(const rec of recs)await api({action:'add',rec});
      else recs=rows;
      localStorage.setItem(KEY+':cfg',JSON.stringify(cfg));save();pull();
      say(box,'เชื่อม Google Sheet สำเร็จ','good');
    }catch(er){cfg=prev;say(box,'เชื่อมไม่สำเร็จ: '+er.message+' ตรวจลิงก์และรหัสลับอีกครั้ง','err')}
  };
  return[box,el('form',{novalidate:'',onsubmit:save_},
    el('div',{class:'f'},el('label',{for:'u'},'ลิงก์ Web App (/exec)'),u),
    el('div',{class:'f'},el('label',{for:'tk'},'รหัสลับ'),tk,el('div',{class:'hint'},'ต้องตรงกับค่า TOKEN ในสคริปต์ Google Sheet')),
    el('button',{class:'btn',type:'submit'},'ทดสอบและบันทึก')),
    el('p',{class:'hint'},'ค่านี้เก็บในเบราว์เซอร์เครื่องนี้ ต้องตั้งในแต่ละเครื่องที่ใช้ ปล่อยว่างทั้งสองช่องแล้วกดบันทึกเพื่อยกเลิกการเชื่อม')];
}

function viewCars(){
  const box=msgBox();let photo='',editId='';
  const n=el('input',{id:'n',autocomplete:'off',placeholder:'เช่น CR-V คันสีขาว'});
  const pl=el('input',{id:'pl',autocomplete:'off',placeholder:'เช่น กข 1234 กรุงเทพ'});
  const vn=el('input',{id:'vn',autocomplete:'off',placeholder:'เลขตัวถัง 17 หลัก'});
  const tx=el('input',{id:'tx',type:'date'});
  const nt=el('input',{id:'nt',autocomplete:'off',placeholder:'เช่น ประกันภัยชั้น 1 หมดเดือน มี.ค.'});
  const m=el('input',{id:'m',autocomplete:'off',placeholder:'เช่น Honda CR-V 2009'});
  const pv=el('img',{class:'thumb',alt:'',hidden:''});
  const pic=el('input',{id:'p',type:'file',accept:'image/*',onchange:async e=>{
    try{photo=await shrink(e.target.files[0]);pv.src=photo;pv.hidden=false}catch(er){say(box,er.message,'err')}}});
  const go=el('button',{class:'btn',type:'submit'},'เพิ่มรถ');
  const f=el('form',{novalidate:'',onsubmit:e=>{
    e.preventDefault();const name=n.value.trim();
    if(!name)return say(box,'กรุณาใส่ชื่อรถ','err'),n.focus();
    if(cars.some(c=>c.name===name&&c.id!==editId))return say(box,'มีรถชื่อนี้อยู่แล้ว','err');
    const extra=nm=>({name:nm,model:m.value.trim(),plate:pl.value.trim(),vin:vn.value.trim(),taxDue:tx.value,note:nt.value.trim()});
    const old=cars.map(x=>({...x})),oa=active;
    if(editId){const c=cars.find(x=>x.id===editId);Object.assign(c,extra(name));if(photo)c.photo=photo}
    else{const c={id:'c'+Date.now(),...extra(name),photo};cars.push(c);active=c.id}
    if(!saveCars()){cars=old;active=oa;return say(box,'บันทึกไม่ได้: พื้นที่เก็บข้อมูลเต็มหรือใช้ไม่ได้ ลองใช้รูปที่เล็กลง','err')}
    render();
  }},
    el('div',{class:'f'},el('label',{for:'n'},'ชื่อรถ'),n,el('div',{class:'hint'},'ชื่อนี้ใช้จับคู่กับรายการบันทึกงาน')),
    el('div',{class:'f'},el('label',{for:'m'},'รุ่น/ปี ',el('span',{class:'opt'},'(ไม่บังคับ)')),m),
    el('div',{class:'f'},el('label',{for:'pl'},'ทะเบียน ',el('span',{class:'opt'},'(ไม่บังคับ)')),pl),
    el('div',{class:'f'},el('label',{for:'vn'},'เลขตัวถัง ',el('span',{class:'opt'},'(ไม่บังคับ)')),vn),
    el('div',{class:'f'},el('label',{for:'tx'},'ภาษีครบกำหนด ',el('span',{class:'opt'},'(ไม่บังคับ)')),tx,el('div',{class:'hint'},'ใช้เตือนต่อภาษี ถ้าบันทึกงาน "ต่อภาษี" ภายหลัง ระบบจะนับรอบใหม่ให้เอง')),
    el('div',{class:'f'},el('label',{for:'nt'},'อื่นๆ ',el('span',{class:'opt'},'(โน้ตของรถคันนี้)')),nt),
    el('div',{class:'f'},el('label',{for:'p'},'รูปรถ ',el('span',{class:'opt'},'(ไม่บังคับ)')),pic,pv,el('div',{class:'hint'},'รูปเก็บในเครื่องนี้เท่านั้น และย่อให้อัตโนมัติ')),
    go);
  const list=cars.map(c=>el('div',{class:'rec'},
    c.photo?el('img',{class:'thumb',src:c.photo,alt:''}):el('div',{class:'thumb ph','aria-hidden':'true',style:'font-size:24px'},c.name.slice(0,1)),
    el('div',{style:'flex:1'},el('b',{},c.name),el('span',{class:'meta'},[c.model,c.plate,c.vin&&'VIN '+c.vin,c.taxDue&&'ภาษี '+new Date(c.taxDue).toLocaleDateString('th-TH'),c.note].filter(Boolean).join(' · '))),
    el('button',{class:'chip',type:'button',onclick:()=>{editId=c.id;n.value=c.name;m.value=c.model||'';pl.value=c.plate||'';vn.value=c.vin||'';tx.value=c.taxDue||'';nt.value=c.note||'';photo='';pv.src=c.photo||'';pv.hidden=!c.photo;go.textContent='บันทึกการแก้ไข';n.focus()}},'แก้ไข'),
    el('button',{class:'del','aria-label':'ลบรถ '+c.name,onclick:()=>{
      if(!confirm('ลบโปรไฟล์ "'+c.name+'"? ประวัติการซ่อมของรถคันนี้ยังอยู่'))return;
      cars=cars.filter(x=>x.id!==c.id);saveCars();render()}},'ลบ')));
  return[box,...(list.length?list:[el('div',{class:'empty'},'ยังไม่มีโปรไฟล์รถ เพิ่มคันแรกด้านล่าง')]),el('h2',{style:'font-size:21px;margin:24px 0 12px'},'เพิ่ม / แก้ไขโปรไฟล์รถ'),f];
}

const doneBtn=(vehicle,type)=>el('button',{class:'chip',type:'button',onclick:()=>{prefill={vehicle,type};location.hash='add'}},'บันทึกว่าทำแล้ว');
const ST_L={ok:'ปกติ',soon:'ใกล้ถึงกำหนด',overdue:'เกินกำหนด',none:'ยังไม่มีข้อมูล'};
function allAlerts(){
  const names=[...new Set([...cars.map(c=>c.name),...recs.map(r=>r.vehicle)])];
  return names.flatMap(n=>statusOf(n,(carByName(n)||{}).taxDue).filter(x=>x.status==='overdue'||x.status==='soon').map(x=>({...x,vehicle:n})))
    .sort((a,b)=>(a.status==='overdue'?0:1)-(b.status==='overdue'?0:1)||b.ratio-a.ratio);
}
function viewAlerts(){
  const list=allAlerts();
  if(!list.length)return[el('div',{class:'empty'},'ตอนนี้ไม่มีเรื่องที่ต้องจัดการ'),el('p',{class:'hint'},'ระบบจะเตือนเมื่อเกิน 80% ของรอบ ดูรอบทั้งหมดและแก้ไขได้ที่ "ตารางซ่อม"')];
  return[el('p',{class:'hint'},'เรียงจากเร่งด่วนที่สุด กด "บันทึกว่าทำแล้ว" เมื่อทำเสร็จเพื่อเริ่มนับรอบใหม่'),
    ...list.map(x=>el('div',{class:'st'},
      el('div',{class:'top'},el('b',{},x.R.label),el('span',{class:'tag '+x.status},ST_L[x.status])),
      el('div',{class:'meta'},x.vehicle+' · '+x.text),el('div',{style:'margin-top:10px'},doneBtn(x.vehicle,x.R.label))))];
}
function viewSchedule(){
  const c=activeCar(),name=c?c.name:(recs.length?recs[recs.length-1].vehicle:'');
  if(!name)return[el('div',{class:'empty'},'เพิ่มรถที่ "โปรไฟล์" หรือบันทึกงานก่อน เพื่อดูตารางซ่อม')];
  const rows=statusOf(name,c&&c.taxDue);
  return[el('p',{class:'hint'},'ตารางรอบซ่อมของ '+name+' แก้รอบให้ตรงคู่มือรถได้ (เก็บในเครื่องนี้)'),
    ...rows.map(x=>{
      const R=x.R,kmI=el('input',{type:'number',inputmode:'numeric',min:'0',value:R.km||'',placeholder:'ไม่นับกม.','aria-label':'ทุกกี่ กม.'});
      const moI=el('input',{type:'number',inputmode:'numeric',min:'1',value:R.mo,'aria-label':'ทุกกี่เดือน'});
      return el('div',{class:'st'},
        el('div',{class:'top'},el('b',{},R.label),el('span',{class:'tag '+x.status},ST_L[x.status])),
        el('div',{class:'meta'},'รอบ: '+ivText(R)),
        el('div',{class:'meta'},x.last&&x.last.date?'ทำล่าสุด '+new Date(x.last.date).toLocaleDateString('th-TH')+(x.last.km?' · '+th(x.last.km)+' กม.':''):'ยังไม่เคยบันทึก'),
        x.status!=='none'?el('div',{class:'meta'},'ครบกำหนด: '+x.text):null,
        el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px'},doneBtn(name,R.label)),
        el('details',{style:'margin-top:10px'},el('summary',{style:'cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center'},'แก้รอบ'),
          el('div',{class:'row2',style:'margin-top:8px'},el('div',{},el('label',{},'ทุกกี่ กม.'),kmI),el('div',{},el('label',{},'ทุกกี่เดือน'),moI)),
          el('div',{class:'row2'},
            el('button',{class:'btn alt',type:'button',onclick:()=>{const m=Math.max(1,+moI.value||R.mo);sched[R.label]={km:Math.max(0,+kmI.value||0),mo:m};saveSched();render()}},'บันทึกรอบ'),
            el('button',{class:'btn alt',type:'button',onclick:()=>{delete sched[R.label];saveSched();render()}},'ใช้ค่าเริ่มต้น'))));
    })];
}

const VIEWS={schedule:viewSchedule,alerts:viewAlerts,cars:viewCars,add:viewAdd,status:viewStatus,history:viewHistory,settings:viewSettings};
function hero(){
  const h=document.getElementById('hero'),c=activeCar();
  if(!c)return h.replaceChildren();
  const sel=el('select',{'aria-label':'เลือกรถ',onchange:e=>{active=e.target.value;saveCars();render()}},
    cars.map(x=>el('option',{value:x.id,...(x.id===c.id?{selected:''}:{})},x.name+(x.model?' · '+x.model:''))));
  h.replaceChildren(el('div',{class:'hero'},c.photo?el('img',{src:c.photo,alt:c.name}):el('div',{class:'ph','aria-hidden':'true'},c.name.slice(0,1)),el('div',{class:'bar'},sel)));
}
function badge(){
  const a=document.querySelector('nav a[href="#alerts"]'),n=allAlerts().length,b=a.querySelector('.badge');
  if(b)b.remove();
  if(n)a.append(el('span',{class:'badge','aria-label':n+' เรื่องที่ต้องจัดการ'},n));
}
function render(){
  const h=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'add';
  document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+h?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  badge();hero();document.getElementById('main').replaceChildren(...VIEWS[h]());
}
addEventListener('hashchange',render);render();pull();
</script>
